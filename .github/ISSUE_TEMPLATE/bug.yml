name: 问题反馈
description: 报告编辑、输入法、回填或界面问题
body:
  - type: input
    id: version
    attributes:
      label: 拼音浮笺版本
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows 版本及目标应用版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与预期结果
      description: 回填问题请说明是在聊天编辑区、搜索框、备注还是其他控件唤起。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 是否已开启“系统通知”（默认关闭）？文字是否进入剪贴板或原输入框？不要上传草稿、整份个人配置或含隐私的截图。
    validations:
      required: true
